name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: syntax (node --check 全量)
        run: find core hands motion scripts test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 全量测试（轨迹/cua智能层/act/register/bridge/selftest/构建产物）
        run: npm test
      - name: 分发完整性（离线部分：版本/关键文件/npm 包）
        run: node scripts/preflight.js --offline
      - name: 版本一致（manifest == package.json）
        run: node -e "const p=require('./package.json').version,m=require('./hands/browser/extension/manifest.json').version;if(p!==m){console.error('version mismatch',p,m);process.exit(1)}console.log('version',p,'aligned')"
